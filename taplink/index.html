<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Новогодний Taplink — пример · Arystan Motion</title>
<meta name="description" content="Тот же Taplink: структура и функции без изменений, новогодний стиль и декор. Пример работы Arystan Motion">
<meta property="og:title" content="Новогодний Taplink — пример работы">
<meta property="og:description" content="Тот же Taplink: структура и функции без изменений, новогодний стиль и декор. Пример работы Arystan Motion">
<meta property="og:image" content="https://arystanbek-dev.github.io/taplink/preview.jpg">

<style>
@font-face { font-family: Inter; src: url(fonts/Inter-Regular.woff); font-weight: 400; }
@font-face { font-family: Inter; src: url(fonts/Inter-Medium.woff); font-weight: 500; }
@font-face { font-family: Inter; src: url(fonts/Inter-SemiBold.woff); font-weight: 600; }
@font-face { font-family: Cormorant; src: url(fonts/CormorantGaramond.woff); font-weight: 300 700; }
@font-face { font-family: Cormorant; src: url(fonts/CormorantGaramond-Italic.woff); font-weight: 300 700; font-style: italic;}

:root { --bg: #ece8e2; --ink: #28221e; --mute: #786e66; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
header { text-align: center; padding: 40px 16px 24px; }
h1 { font: italic 600 44px/1.1 Cormorant; }
header p { margin-top: 8px; color: var(--mute); font-size: 15px; }
.phone { width: 390px; height: 780px; margin: 0 auto; border: 12px solid #121214; border-radius: 52px; overflow: hidden;
         box-shadow: 0 24px 60px rgba(0,0,0,.25); background: #121214; }
iframe { display: block; width: 100%; height: 100%; border: 0; }
.switch { display: flex; gap: 4px; width: max-content; margin: 24px auto 0; padding: 4px; border-radius: 999px;
          background: rgba(40,34,30,.08); }
.switch button { border: 0; border-radius: 999px; padding: 10px 26px; background: none; color: var(--ink);
                 font: italic 600 22px Cormorant; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
footer { text-align: center; padding: 28px 16px 40px; color: var(--mute); font-size: 13px; line-height: 1.6; }
footer a { color: inherit; }
/* a phone: the page itself fills the screen, the switch floats over it */
@media (max-width: 600px) {
  header, footer { display: none; }
  .phone { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
  .switch { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); margin: 0;
            background: rgba(20,20,22,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .switch button { color: #f3ead6; }
  .switch button[aria-pressed="true"] { background: #f3ead6; color: #1a1a1a; }
}
</style></head><body>
<header><h1>Новогодний Taplink</h1><p>Тот же Taplink: структура и функции без изменений, новый стиль и декор</p></header>
<div class="phone"><iframe id="view" src="after.html" title="Пример страницы Taplink"></iframe></div>
<div class="switch" role="group" aria-label="Версия страницы">
  <button type="button" data-src="before.html" aria-pressed="false">до</button>
  <button type="button" data-src="after.html" aria-pressed="true">после</button>
</div>
<footer>Демо-страница: бренд MIRA beauty studio придуман для примера.<br>
Дизайн — <a href="https://t.me/arystan_motion">Arystan Motion</a> · <a href="../">портфолио</a> ·
<a href="https://taplink.cc/mira_demo">эта страница в Taplink</a><br>© Arystan Motion</footer>
<script>
const view = document.getElementById("view");
document.querySelectorAll(".switch button").forEach(b => b.addEventListener("click", () => {
  view.src = b.dataset.src;
  document.querySelectorAll(".switch button").forEach(x => x.setAttribute("aria-pressed", x === b));
}));
</script>
</body></html>
